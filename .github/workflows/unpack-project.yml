name: Unpack AO Events Center Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Flutter project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          mkdir _unzipped
          unzip -q "$ZIP_FILE" -d _unzipped

          ITEMS=$(find _unzipped -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ITEMS" -eq 1 ] && [ -d "$(find _unzipped -mindepth 1 -maxdepth 1 -type d)" ]; then
            PROJECT_DIR=$(find _unzipped -mindepth 1 -maxdepth 1 -type d)
            cp -a "$PROJECT_DIR"/. .
          else
            cp -a _unzipped/. .
          fi

          rm -rf _unzipped "$ZIP_FILE"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract AO Events Center Flutter project"
            git push
          fi
